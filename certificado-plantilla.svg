<text x="700" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#537083">Documento de identidad: <tspan font-weight="700" fill="#0b2941">@@DOCUMENT@@</tspan></text><text x="700" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#537083">Por haber aprobado con un puntaje mínimo de 80 % el curso</text><text x="700" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0b2941">REDES DE FIBRA ÓPTICA</text><text x="700" y="681" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#00a9cb">Domina la conectividad del futuro</text>
